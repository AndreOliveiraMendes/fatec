{% extends "base-fixed" %}
{% block title %}
    Mail Test
{% endblock title %}
{% block content %}
    <h1>Mail Test</h1>
    <p>This page is used to test the mail sending functionality.</p>
    <form method="post">
        <div class="form-group">
            <label for="email">Recipient Email:</label>
            <input type="email" class="form-control" id="email" name="email" required>
        </div>
        <div class="form-group">
            <label>Authentication Method:</label>
            <div>
                <button type="submit"
                        name="method"
                        value="apppassword"
                        class="btn btn-primary">App Password</button>
                <button type="submit" name="method" value="oauth" class="btn btn-default">OAuth</button>
            </div>
        </div>
    </form>
{% endblock content %}
