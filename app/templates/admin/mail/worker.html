{% extends "base-fixed" %}
{% block title %}
    Worker de emails
{% endblock title %}
{% block content %}
    <div class="container">
        <h3>Worker de emails</h3>
        <div class="row">
            <div class="col-md-6">
                <div id="panelHeartbeat" class="panel panel-default">
                    <div class="panel-heading">
                        <span class="glyphicon glyphicon-heart"></span>
                        Último heartbeat
                    </div>
                    <div class="panel-body">
                        <strong id="heartbeat">...</strong>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="panel panel-default">
                    <div class="panel-heading">
                        <span class="glyphicon glyphicon-cog"></span>
                        Status
                    </div>
                    <div class="panel-body">
                        <strong id="status">...</strong>
                    </div>
                </div>
            </div>
        </div>
        <button id="btnWorker" class="btn btn-primary" onclick="alternarWorker()"></button>
    </div>
{% endblock content %}
{% block extra_script %}
    <script>
        function tempoRelativo(data) {
            if (!data) {
                return "Sem heartbeat";
            }

            const dataHeartbeat = new Date(data);
            const agora = new Date();

            const segundos = Math.floor(
                (agora - dataHeartbeat) / 1000
            );

            if (segundos < 60) {
                return `há ${segundos} segundo${segundos === 1 ? "" : "s"}`;
            }

            const minutos = Math.floor(segundos / 60);

            if (minutos < 60) {
                return `há ${minutos} minuto${minutos === 1 ? "" : "s"}`;
            }

            const horas = Math.floor(minutos / 60);

            return `há ${horas} hora${horas === 1 ? "" : "s"}`;
        }

        function formatarDataHora(data) {
            if (!data) {
                return "Sem heartbeat";
            }

            const dataHeartbeat = new Date(data);
            return dataHeartbeat.toLocaleString();
        }

        function atualizarCorHeartbeat(data) {
            const panel = document.getElementById("panelHeartbeat");

            panel.classList.remove(
                "panel-default",
                "panel-success",
                "panel-warning",
                "panel-danger"
            );

            if (!data) {
                panel.classList.add("panel-danger");
                return;
            }

            const dataHeartbeat = new Date(data);
            const agora = new Date();

            const segundos = Math.floor(
                (agora - dataHeartbeat) / 1000
            );

            if (segundos < 60) {
                panel.classList.add("panel-success");
            } else if (segundos < 300) {
                panel.classList.add("panel-warning");
            } else {
                panel.classList.add("panel-danger");
            }
        }

        const url_status = `{{ url_for("api_worker.worker_status") }}`;
        const url_start = `{{ url_for("api_worker.worker_start") }}`;
        const url_stop = `{{ url_for("api_worker.worker_stop") }}`;
        async function atualizarStatus() {
            const response = await fetch(url_status);
            const data = await response.json();

            const status = document.getElementById("status");
            const heartbeat = document.getElementById("heartbeat");
            const btn = document.getElementById("btnWorker");
            const dataHeartbeat = data.heartbeat;

            heartbeat.textContent = dataHeartbeat
                ? `${tempoRelativo(dataHeartbeat)} (${formatarDataHora(dataHeartbeat)})`
                : "Sem heartbeat";

            atualizarCorHeartbeat(dataHeartbeat);
            if (data.ativo) {
                status.textContent = "Rodando";
                btn.textContent = "Parar worker";
                btn.className = "btn btn-danger";
                btn.onclick = () => alterarWorker(url_stop);
            } else {
                status.textContent = "Pausado";
                btn.textContent = "Iniciar worker";
                btn.className = "btn btn-success";
                btn.onclick = () => alterarWorker(url_start);
            }
        }

        async function alterarWorker(acao) {
            const response = await fetch(acao, {
                method: "POST"
            });

            const data = await response.json();

            if (!response.ok) {
                alert(data.error || "Não foi possível alterar o estado do worker.");
                return;
            }

            atualizarStatus();
        }

        atualizarStatus();
        setInterval(atualizarStatus, 5000);
    </script>
{% endblock extra_script %}
