{% extends "base-fixed" %}
{% block title %}
    Configurações de destinatario
{% endblock title %}
{% block content %}
    <div class="panel panel-default">
        <div class="panel-heading clearfix">
            <h3 class="panel-title pull-left">
                <span class="glyphicon glyphicon-envelope"></span>
                Configurações de Destinatarios
            </h3>
            <div class="pull-right">
                <button id="btnAddMail" class="btn btn-primary btn-sm">
                    <span class="glyphicon glyphicon-plus"></span>
                    Novo Destinatario
                </button>
            </div>
        </div>
        <div class="panel-body">
            <table class="table table-striped table-bordered" id="tableMail">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Email</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>
            </table>
        </div>
    </div>
    <!-- Modal de configuração -->
    <div class="modal fade"
         id="modalMail"
         tabindex="-1"
         role="dialog"
         aria-labelledby="modalMailLabel">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-label="Fechar">
                        <span aria-hidden="true">×</span>
                    </button>
                    <h4 class="modal-title" id="modalMailLabel">
                        <span class="glyphicon glyphicon-envelope"></span>
                        <span id="modalMailTitle">Novo Destinatário</span>
                    </h4>
                </div>
                <form id="formMail">
                    <div class="modal-body">
                        <input type="hidden" id="mailId" name="id">
                        <div class="form-group">
                            <label for="mailNome">Nome</label>
                            <input type="text"
                                   class="form-control"
                                   id="mailNome"
                                   name="nome"
                                   placeholder="Nome do destinatário"
                                   required>
                        </div>
                        <div class="form-group">
                            <label for="mailEmail">Email</label>
                            <input type="email"
                                   class="form-control"
                                   id="mailEmail"
                                   name="email"
                                   placeholder="exemplo@dominio.com"
                                   required>
                        </div>
                        <div class="form-group">
                            <label for="mailStatus">Status</label>
                            <div class="checkbox">
                                <label>
                                    <input type="checkbox" id="mailStatus" name="ativo" checked>
                                    Destinatário ativo
                                </label>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-default" data-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">
                            <span class="glyphicon glyphicon-floppy-disk"></span>
                            Salvar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock content %}
{% block extra_script %}
    <script>
        (function(){
            const table = document.getElementById('tableMail');
            const form = document.getElementById('formMail');

            let tableBody = table.querySelector('tbody');

            if (!tableBody) {
                tableBody = document.createElement('tbody');
                table.appendChild(tableBody);
            }

            const modal = $('#modalMail');

            function novoDestinatario() {
                form.reset();

                document.getElementById('mailId').value = '';
                document.getElementById('mailStatus').checked = true;

                document.getElementById('modalMailTitle').textContent =
                    'Novo Destinatário';

                modal.modal('show');
            }

            function editarDestinatario(recipient) {
                document.getElementById('mailId').value = recipient.id;
                document.getElementById('mailNome').value = recipient.nome;
                document.getElementById('mailEmail').value = recipient.email;
                document.getElementById('mailStatus').checked = recipient.ativo;

                document.getElementById('modalMailTitle').textContent =
                    'Editar Destinatário';

                modal.modal('show');
            }

            document.getElementById('btnAddMail')
                .addEventListener('click', novoDestinatario);

            function carregarConfiguracoes() {
                fetch('{{ url_for("api_mail_recipient.api_mail_list") }}')
                    .then(r => r.json())
                    .then(data => {
                        tableBody.innerHTML = '';

                        const recipients = data.recipients;

                        if (recipients.length === 0) {
                            tableBody.innerHTML = `
                                <tr>
                                    <td colspan="5" class="text-center text-muted">
                                        Nenhum destinatário configurado
                                    </td>
                                </tr>
                            `;
                            return;
                        }

                        recipients.forEach(recipient => {
                            const tr = document.createElement('tr');

                            tr.innerHTML = `
                                <td>${recipient.id}</td>
                                <td>${recipient.nome}</td>
                                <td>${recipient.email}</td>
                                <td>
                                    ${
                                        recipient.ativo
                                            ? '<span class="label label-success">Ativo</span>'
                                            : '<span class="label label-default">Inativo</span>'
                                    }
                                </td>
                                <td>
                                    <button class="btn btn-xs btn-primary btn-edit" data-id="${recipient.id}">
                                        <span class="glyphicon glyphicon-pencil"></span>
                                        Editar
                                    </button>
                                </td>
                            `;

                            tr.querySelector('.btn-edit')
                                .addEventListener('click', () => {
                                    editarDestinatario(recipient);
                                });

                            tableBody.appendChild(tr);
                        });
                    });
            }

            form.addEventListener('submit', function(event) {
                event.preventDefault();

                const data = {
                    id: document.getElementById('mailId').value || null,
                    nome: document.getElementById('mailNome').value,
                    email: document.getElementById('mailEmail').value,
                    ativo: document.getElementById('mailStatus').checked
                };
                fetch('{{ url_for("api_mail_recipient.api_mail_save") }}', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                })
                .then(r => r.json())
                .then(resp => {
                    if (resp.success) {
                        modal.modal('hide');
                        carregarConfiguracoes();
                        console.log("aqui");
                    } else {
                        alert(
                            resp.error ||
                            'Erro ao salvar destinatario.'
                        );
                    }
                });
            });

            carregarConfiguracoes();
        })();
    </script>
{% endblock extra_script %}
